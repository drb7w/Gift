<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى ألطف شخص ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ff4b72;
            --secondary: #ff85a2;
            --bg: #0f0c20;
            --card-bg: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f0c20, #2b102f, #1a0826);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية تساقط القلوب */
        .heart-particle {
            position: fixed;
            top: -20px;
            color: var(--secondary);
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* مشغل الصوت العلوي */
        .top-audio {
            z-index: 10;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .audio-icon {
            font-size: 20px;
            animation: spin 3s linear infinite;
            animation-play-state: paused;
        }

        .playing .audio-icon {
            animation-play-state: running;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* الحاوية الرئيسية والصفحات */
        .main-container {
            width: 100%;
            max-width: 400px;
            z-index: 2;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .page {
            display: none;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* الصفحة الأولى: الترحيب والظرف */
        .envelope-icon { font-size: 65px; margin-bottom: 10px; }
        .secret-message {
            display: none;
            margin-top: 15px;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ff2a5f;
            text-shadow: 0 0 15px rgba(255, 42, 95, 0.8);
            animation: popIn 0.5s ease forwards;
        }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        /* الصفحة الثانية: الرسائل العشوائية */
        .btn-action {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white; border: none; padding: 12px 25px;
            font-size: 1rem; font-weight: 800; border-radius: 25px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255, 75, 114, 0.4);
            margin-bottom: 20px;
        }
        .quote-text { font-size: 1.2rem; min-height: 80px; display: flex; align-items: center; justify-content: center; color: #ffe6ec; }

        /* الصفحة الثالثة: اللعبة التفاعلية */
        .game-title { font-size: 1.4rem; margin-bottom: 30px; color: #ffccd5; }
        .btn-group { display: flex; justify-content: center; gap: 20px; align-items: center; position: relative; min-height: 80px; }
        .btn-yes { background: #2ec4b6; color: white; border: none; padding: 12px 35px; font-size: 1.1rem; font-weight: bold; border-radius: 25px; cursor: pointer; }
        .btn-no { background: #e63946; color: white; border: none; padding: 12px 35px; font-size: 1.1rem; font-weight: bold; border-radius: 25px; cursor: pointer; position: absolute; transition: 0.2s ease; }

        /* الصفحة الرابعة: الختام */
        .final-title { font-size: 1.8rem; color: #ffccd5; margin-bottom: 15px; }

        /* أزرار التنقل السفلية */
        .nav-controls {
            z-index: 10;
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            justify-content: space-between;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }

        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body onclick="startAudioOnFirstTouch()">

    <!-- رابط موسيقى مباشر ومضمون التوصيل -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <!-- شريط الصوت العلوي -->
    <div class="top-audio" id="audioToggle" onclick="toggleAudio(event)">
        <span class="audio-icon">🎵</span>
        <span id="audioText" style="font-size: 0.85rem;">تشغيل الموسيقى ✨</span>
    </div>

    <!-- الحاوية الرئيسية للأقسام -->
    <div class="main-container">

        <!-- الصفحة 1: الرسالة المغلقة -->
        <div class="page active" id="page1">
            <h2 style="margin-bottom: 15px; color: #ffb3c6;">الرسالة المفاجئة ✉️</h2>
            <div onclick="openEnvelope()" style="cursor: pointer;">
                <div class="envelope-icon" id="envIcon">✉️</div>
                <p id="envHint" style="color: #bbb; font-size: 0.96rem;">اضغطي على الظرف لفتحه 💌</p>
                <div class="secret-message" id="secretMsg">احبچ ❤️</div>
            </div>
        </div>

        <!-- الصفحة 2: الرسائل العشوائية -->
        <div class="page" id="page2">
            <h2 style="margin-bottom: 15px; color: #ffb3c6;">رسائل خاصة لكِ 🌸</h2>
            <button class="btn-action" onclick="showRandomQuote()">اضغطي لرسالة جديدة 💌</button>
            <div class="quote-text" id="quoteBox">اضغطي على الزر أعلاه...</div>
        </div>

        <!-- الصفحة 3: لعبة الأزرار -->
        <div class="page" id="page3">
            <div class="game-title">سؤال سريع: تحبيني؟ 🙈</div>
            <div class="btn-group" id="gameArea">
                <button class="btn-yes" onclick="answerYes()">نعم أكيد! ❤️</button>
                <button class="btn-no" id="noBtn" onmouseover="moveNoBtn()" onclick="moveNoBtn()">لا 😜</button>
            </div>
        </div>

        <!-- الصفحة 4: الختام التوقيع المخصص -->
        <div class="page" id="page4">
            <div class="final-title">دمتِ لي شيئاً جميلاً لا ينتهي ✨❤️</div>
            <p style="color: #ddd; line-height: 1.8; margin-bottom: 15px;">صُنعت هذه الصفحة بكل حب لترسم ابتسامة على وجهكِ اللطيف.</p>
            <p style="color: #ff85a2; font-weight: bold; font-size: 1.1rem; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 12px;">
                من الشخص النادر والأجمل علي 👑
            </p>
        </div>

    </div>

    <!-- شريط التنقل بين الصفحات -->
    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>السابق</button>
        <span id="pageIndicator" style="align-self: center; font-size: 0.9rem; color: #aaa;">1 / 4</span>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">التالي</button>
    </div>

    <script>
        // 1. إدارة الصوت تلقائياً مع لمس الشاشة
        const music = document.getElementById('bgMusic');
        const audioToggle = document.getElementById('audioToggle');
        const audioText = document.getElementById('audioText');
        let audioStarted = false;

        function startAudioOnFirstTouch() {
            if (!audioStarted) {
                music.play().then(() => {
                    audioStarted = true;
                    audioToggle.classList.add('playing');
                    audioText.innerText = "الموسيقى: شغال ✨";
                }).catch(() => {});
            }
        }

        function toggleAudio(e) {
            e.stopPropagation();
            if (music.paused) {
                music.play();
                audioStarted = true;
                audioToggle.classList.add('playing');
                audioText.innerText = "الموسيقى: شغال ✨";
            } else {
                music.pause();
                audioToggle.classList.remove('playing');
                audioText.innerText = "الموسيقى: متوقفة 🔇";
            }
        }

        // 2. التنقل بين الصفحات
        let currentPage = 1;
        const totalPages = 4;

        function changePage(step) {
            document.getElementById(`page${currentPage}`).classList.remove('active');
            currentPage += step;
            document.getElementById(`page${currentPage}`).classList.add('active');

            document.getElementById('prevBtn').disabled = (currentPage === 1);
            document.getElementById('nextBtn').disabled = (currentPage === totalPages);
            document.getElementById('pageIndicator').innerText = `${currentPage} / ${totalPages}`;
        }

        // 3. تساقط القلوب
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = ['❤️', '💖', '💗', '✨', '🌸'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 300);

        // 4. فتح الظرف
        function openEnvelope() {
            document.getElementById('envIcon').innerText = '📩';
            document.getElementById('envHint').style.display = 'none';
            document.getElementById('secretMsg').style.display = 'block';
            confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
        }

        // 5. اقتباسات عشوائية
        const quotes = [
            "وجودج بحياتي يخلي كل يوم أحلى وأجمل ✨",
            "كل لحظة وياج تسوى الدنيا كلها ❤️",
            "أنتِ مو بس شخص عزيز، أنتِ كل أشيائي الحلوة 🌸",
            "ابتسامتج تنور يومي كله 💖",
            "شكراً لأنكِ موجودة بحياتي وبس 👑",
            "كل الأوقات تكون أحلى لما تكونين وياي 🥰"
        ];

        function showRandomQuote() {
            const quoteBox = document.getElementById('quoteBox');
            const randomIndex = Math.floor(Math.random() * quotes.length);
            quoteBox.style.opacity = 0;
            setTimeout(() => {
                quoteBox.innerText = quotes[randomIndex];
                quoteBox.style.opacity = 1;
            }, 200);
        }

        // 6. زر "لا" للهروب
        function moveNoBtn() {
            const noBtn = document.getElementById('noBtn');
            const randomX = (Math.random() - 0.5) * 200;
            const randomY = (Math.random() - 0.5) * 150;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function answerYes() {
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
            alert('أدري والله! وأنا أحبچ أكثر وأكثر ❤️✨');
        }
    </script>
</body>
</html>
