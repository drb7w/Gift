<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة خاصة جداً ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ff4b72;
            --secondary: #ff85a2;
            --bg: #0f0c20;
            --card-bg: rgba(255, 255, 255, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f0c20, #2b102f, #1a0826);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 60px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية تساقط القلوب */
        .heart-particle {
            position: fixed;
            top: -20px;
            color: var(--secondary);
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 450px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }

        .title-header {
            text-align: center;
            margin-bottom: 5px;
        }

        .title-header h1 {
            font-size: 1.8rem;
            color: #ffb3c6;
            text-shadow: 0 0 10px rgba(255, 75, 114, 0.5);
        }

        /* المشغل الصوتي */
        .audio-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .audio-icon {
            font-size: 28px;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 20px;
            outline: none;
        }

        /* الظرف والرسالة المغلقة */
        .envelope-wrapper {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .envelope-icon {
            font-size: 50px;
            margin-bottom: 10px;
            transition: transform 0.4s ease;
        }

        .secret-message {
            display: none;
            margin-top: 15px;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ff2a5f;
            text-shadow: 0 0 15px rgba(255, 42, 95, 0.8);
            animation: popIn 0.5s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* الزر التفاعلي للمشاعر */
        .quote-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .btn-action {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 75, 114, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 12px;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .quote-text {
            font-size: 1.1rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffe6ec;
        }

        /* لعبة الأزرار التفاعلية (هل تحبيني؟) */
        .game-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            min-height: 180px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .game-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #ffccd5;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }

        .btn-yes {
            background: #2ec4b6;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 196, 182, 0.4);
        }

        .btn-no {
            background: #e63946;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            position: absolute;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- العنوان -->
        <div class="title-header">
            <h1>إلى ألطف وأجمل شخص ✨</h1>
        </div>

        <!-- المشغل الصوتي مع رابط الموسيقى المباشر -->
        <div class="audio-card">
            <div class="audio-icon">🎵</div>
            <audio controls id="myAudio">
                <source src="https://assets.mixkit.co/music/preview/mixkit-beautiful-dream-493.mp3" type="audio/mpeg">
                متصفحك لا يدعم المشغل الصوتي.
            </audio>
        </div>

        <!-- الظرف والرسالة المغلقة -->
        <div class="envelope-wrapper" onclick="openEnvelope(this)">
            <div class="envelope-icon" id="envIcon">✉️</div>
            <p id="envHint" style="color: #bbb; font-size: 0.9rem;">اضغطي على الظرف لفتحه 💌</p>
            <div class="secret-message" id="secretMsg">احبچ ❤️</div>
        </div>

        <!-- الزر التفاعلي للرسائل العشوائية -->
        <div class="quote-card">
            <button class="btn-action" onclick="showRandomQuote()">اضغطي هنا ورسالة جديدة 💌</button>
            <div class="quote-text" id="quoteBox">اضغطي على الزر لرؤية الرسالة...</div>
        </div>

        <!-- الزر التفاعلي الممتع (هل تحبيني؟) -->
        <div class="game-card" id="gameArea">
            <div class="game-title">سؤال سريع: تحبيني؟ 🙈</div>
            <div class="btn-group">
                <button class="btn-yes" onclick="answerYes()">نعم أكيد! ❤️</button>
                <button class="btn-no" id="noBtn" onmouseover="moveNoBtn()" onclick="moveNoBtn()">لا 😜</button>
            </div>
        </div>

    </div>

    <script>
        // 1. إنشاء تساقط القلوب في الخلفية
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = ['❤️', '💖', '💗', '✨', '🌸'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 300);

        // 2. فتح الظرف والرسالة
        function openEnvelope(element) {
            document.getElementById('envIcon').innerText = '📩';
            document.getElementById('envHint').style.display = 'none';
            document.getElementById('secretMsg').style.display = 'block';
            confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
        }

        // 3. الرسائل العشوائية
        const quotes = [
            "وجودج بحياتي يخلي كل يوم أحلى وأجمل ✨",
            "كل لحظة وياج تسوى الدنيا كلها ❤️",
            "أنتِ مو بس شخص عزيز، أنتِ كل أشيائي الحلوة 🌸",
            "ابتسامتج تنور يومي كله 💖",
            "شكراً لأنكِ موجودة بحياتي وبس 👑",
            "كل الأوقات تكون أحلى لما تكونين وياي 🥰"
        ];

        function showRandomQuote() {
            const quoteBox = document.getElementById('quoteBox');
            const randomIndex = Math.floor(Math.random() * quotes.length);
            quoteBox.style.opacity = 0;
            setTimeout(() => {
                quoteBox.innerText = quotes[randomIndex];
                quoteBox.style.opacity = 1;
            }, 200);
        }

        // 4. تحريك زر "لا" للهروب
        function moveNoBtn() {
            const noBtn = document.getElementById('noBtn');
            const gameArea = document.getElementById('gameArea');
            
            const areaRect = gameArea.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            const maxX = areaRect.width - btnRect.width - 20;
            const maxY = areaRect.height - btnRect.height - 20;

            const randomX = Math.floor(Math.random() * maxX) - (areaRect.width / 2) + 50;
            const randomY = Math.floor(Math.random() * maxY) - (areaRect.height / 2) + 30;

            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // 5. الضغط على زر "نعم"
        function answerYes() {
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 }
            });
            alert('أدري والله! وأنا أحبچ أكثر وأكثر ❤️✨');
        }
    </script>
</body>
</html>
